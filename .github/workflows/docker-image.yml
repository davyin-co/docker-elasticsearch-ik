name: Docker Image CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly auto-follow of new ES tags. See .github/scripts/discover_versions.py.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      versions:
        description: 'Override versions (comma-separated, e.g. 9.4.2,8.19.17). Empty = auto.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  discover:
    name: Discover build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.publish.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute matrix
        id: compute
        env:
          DISCOVER_EXTRA_VERSIONS: ${{ inputs.versions }}
        run: python3 .github/scripts/discover_versions.py

      - name: Publish matrix output
        id: publish
        run: |
          MATRIX=$(cat matrix.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: Build & push ${{ matrix.version }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- DockerHub ------------------------------------------------------
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & push (DockerHub)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: Dockerfile.template
          platforms: linux/amd64,linux/arm64
          tags: davyinsa/elasticsearch-ik:${{ matrix.version }}
          build-args: ES_VERSION=${{ matrix.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Alibaba Cloud CR ----------------------------------------------
      - name: Login to ALIYUN CR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUNCR_USERNAME }}
          password: ${{ secrets.ALIYUNCR_PASSWORD }}

      - name: Build & push (Aliyun)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: Dockerfile.template
          platforms: linux/amd64,linux/arm64
          tags: registry.cn-hangzhou.aliyuncs.com/davyin/elasticsearch-ik:${{ matrix.version }}
          build-args: ES_VERSION=${{ matrix.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- PR-only local validation --------------------------------------
      - name: Build (PR only, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          file: Dockerfile.template
          platforms: linux/amd64
          tags: local/elasticsearch-ik:${{ matrix.version }}
          build-args: ES_VERSION=${{ matrix.version }}
